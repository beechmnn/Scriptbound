<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#071315" />
		<title>Scriptbound</title>
		<style>
			html,
			body,
			iframe {
				width: 100%;
				height: 100%;
				margin: 0;
				border: 0;
			}
			body {
				min-width: 320px;
				overflow: hidden;
				background: #071315;
			}
		</style>
	</head>
	<body>
		<iframe
			id="scriptbound"
			title="Scriptbound"
			allow="fullscreen"
			referrerpolicy="strict-origin-when-cross-origin"
		></iframe>
		<script>
			const appUrl = new URL(__SCRIPTBOUND_PUBLIC_URL_JSON__);
			appUrl.searchParams.set('source', 'itch');
			appUrl.searchParams.set('embedded', '1');
			document.querySelector('#scriptbound').src = appUrl;
		</script>
	</body>
</html>
